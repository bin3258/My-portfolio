<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <link rel="icon" type="image/svg+xml" href="/My-portfolio/vite.svg" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Le Xuan Tai | Portfolio</title>

  <script>
    (function () {
      try {
        var theme = localStorage.getItem("theme");
        if (theme === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      } catch (e) {}
    })();
  </script>

  <style>
    html {
      background: #0f172a;
    }

    html[data-theme="light"] {
      background: #ffffff;
    }
  </style>

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
